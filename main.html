<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Freelance Rate Calculator</h1>
<div id="mainDiv">  
    <div id="inputDiv">
        <div class="inputDivs">
            <p>Your wanted profit per month:</p>
            <input type="number" id="profitMonth">
        </div>
        <div class="inputDivs">
            <p>Your worktime per week (in hours)</p>
            <input type="number" id="worktimeWeek">
        </div>
        <div class="inputDivs">
            <p>Your average worktime per 1 client (in hours):</p>
            <input type="number" id="worktimeClient">
        </div>
        <div class="inputDivs">
            <p>Tax %:</p>
            <input type="number" id="taxRate">
        </div>
        <div class="inputDivs">
            <p>Expenses per month:</p>
            <input type="number" id="expensesMonth">
        </div>
    </div>
    <div id="outputDiv">
        <p>Income per hour needed: <span id="incomeHourOutput">0</span></p>
        <p>Price per client needed: <span id="priceClientOutput">0</span></p>
    </div>
</div>



<script src="script.js"></script>
</body>
</html>
