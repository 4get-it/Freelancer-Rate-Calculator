<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
input needed: 
-profit wanted per month
-worktime per week (in hours)
-worktime per project
-tax% and expenses per month

calculations:
-income/month = (profit/month + expenses/month) : (1 - (tax% : 100))
-income/hour = income/month : (worktime/week * 4.35)                    // 4.35 -> weeks in a month in average
-project price = income/hour * worktime/project

output:
-income per hour needed
-project price
    -->
<div id="mainDiv">  
    <div id="inputDiv">
        <div class="inputDivs">
            <p>Your wanted profit per month:</p>
            <input type="number" id="profitMonth">
        </div>
        <div class="inputDivs">
            <p>Your worktime per week (in hours)</p>
            <input type="number" id="worktimeWeek">
        </div>
        <div class="inputDivs">
            <p>Your average worktime per 1 client (in hours):</p>
            <input type="number" id="worktimeProject">
        </div>
        <div class="inputDivs">
            <p>Tax %:</p>
            <input type="number" id="taxRate">
        </div>
        <div class="inputDivs">
            <p>Expenses per month:</p>
            <input type="number" id="expensesMonth">
        </div>
    </div>
    <div id="outputDiv">
        <p>Income per hour needed:</p>
        <p>Price per client needed:</p>
    </div>
</div>



<script src="script.js"></script>
</body>
</html>
